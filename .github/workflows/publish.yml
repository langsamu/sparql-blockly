name: Publish to NPM

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./package

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'
    - run: npm install -g npm@latest
    - run: npm install
    - run: npm publish
